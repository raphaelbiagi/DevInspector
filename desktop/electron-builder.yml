appId: com.devinspector.desktop
productName: DevInspector
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DevInspector
