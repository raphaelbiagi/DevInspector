name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: Desktop (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # `npm ci` roda o postinstall do electron-builder, que baixa binários
      # desnecessários para checagem estática.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sdk:
    name: SDK React Native (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rn-devtools-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run typecheck
      - run: npm run build
