name: Publish SDK package branch

# Publica o SDK (rn-devtools-client) já compilado na branch `sdk-package`,
# para que apps possam instalá-lo com:
#   npm i -D github:raphaelbiagi/DevInspector#sdk-package
#
# NÃO tem relação com o app desktop nem com o script `npm run dist` dele.

on:
  push:
    branches: [main]
    paths: ['rn-devtools-client/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build e publicar branch sdk-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build do SDK
        working-directory: rn-devtools-client
        run: |
          npm install
          npm run typecheck
          npm run build

      # Monta o conteúdo do pacote FORA da árvore do repo: o .gitignore da raiz
      # ignora `dist/`, então um `checkout --orphan` aqui dentro não conseguiria
      # commitar a saída do tsc.
      - name: Montar o pacote
        run: |
          mkdir -p /tmp/pkg
          cp -r rn-devtools-client/dist rn-devtools-client/src /tmp/pkg/
          cp rn-devtools-client/package.json /tmp/pkg/
          if [ -f rn-devtools-client/README.md ]; then
            cp rn-devtools-client/README.md /tmp/pkg/
          else
            cp README.md /tmp/pkg/
          fi

          # Remove `scripts` e `devDependencies` do package.json publicado.
          # O npm roda `prepare` (não `prepublishOnly`) em dependências git — sem
          # `scripts`, ele pula a instalação de devDependencies inteira, evitando
          # baixar react-native + typescript (~300 MB) na máquina de quem instala.
          # O build já vai pronto na branch, então não há nada para compilar lá.
          node -e "
            const fs = require('fs');
            const p = '/tmp/pkg/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete j.scripts;
            delete j.devDependencies;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      - name: Conferir o pacote montado
        run: |
          test -f /tmp/pkg/package.json
          test -f /tmp/pkg/src/index.ts
          test -f /tmp/pkg/dist/index.d.ts
          echo "Conteúdo de /tmp/pkg:" && ls -la /tmp/pkg

      - name: Publicar na branch sdk-package
        working-directory: /tmp/pkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b sdk-package
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "SDK build de ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sdk-package
